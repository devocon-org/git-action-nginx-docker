name: Build and Run Nginx Web Server on Localhost

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_run_nginx:
    # Runs on your self-hosted runner
    runs-on: [self-hosted, linux, ken-runner]

    steps:
    # Step 1: Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v2  # This checks out the repository's code
    
    # This will print each command that is being executed
    - name: Set up for debugging
      run: |
        set -x   

    # Step 2: Build the Docker image for Nginx web server (including the custom nginx.conf)
    - name: Build Nginx Docker Image
      run: |
        # Ensure the current directory contains Dockerfile and nginx.conf
        docker build -t nginx-webserver .

    # Step 3: Create directory for volumes (for the web content)
    - name: Create directory for volumes
      run: |
        mkdir -p /tmp/nginx_volume

    # Step 4: Copy the Nginx config and content files to the volume directory
    - name: Copy Nginx config and web content to volume directories
      run: |
        cp -r ./nginx/nginx.conf /tmp/nginx_volume/      # Nginx config
        cp -r ./src/* /tmp/nginx_volume/                 # Web content from src

    # Step 5: Run Nginx Docker container with volume mounts
    - name: Run Nginx Docker Container
      run: |
        docker run -d -p 8080:80 --name nginx-container \
        -v /tmp/nginx_volume:/usr/share/nginx/html:ro \
        nginx-webserver

    # Step 6: Verify Docker container is running
    - name: Verify Docker container is running
      run: |
        docker ps

    # Step 7: Test Nginx server by accessing it via curl
    - name: Test Nginx server (localhost:8080)
      run: |
        curl http://localhost:8080





