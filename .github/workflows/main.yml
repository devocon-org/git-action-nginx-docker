name: Build and Run Nginx Web Server on Localhost

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_run_nginx:
    runs-on: [self-hosted, linux, ken-runner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Stop and remove any existing container named "nginx-container"
      - name: Stop and remove existing container (if any)
        run: |
          if [ $(docker ps -q -f name=nginx-container) ]; then
            echo "Stopping and removing existing container..."
            docker stop nginx-container
            docker rm nginx-container
          else
            echo "No existing container found."
          fi

      - name: Build Docker image
        run: |
          docker build -t my-nginx-webserver .

      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 --name nginx-container my-nginx-webserver

      - name: Test Nginx server (localhost:8080)
        run: |
          curl http://localhost:8080
