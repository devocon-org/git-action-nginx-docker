name: Build and Run Nginx Web Server on Localhost

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_run_nginx:
    # Runs on your self-hosted runner
    runs-on: [self-hosted, linux, ken-runner]

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx (optional but recommended for caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t my-nginx-webserver .

      # Run the Docker container
      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 --name nginx-container my-nginx-webserver

      # Verify the container is running by getting logs
      - name: Verify container is running
        run: |
          docker logs -f nginx-container

      # Step 7: Test Nginx server by accessing it via curl
      - name: Test Nginx server (localhost:8080)
        run: |
          curl http://localhost:8080
